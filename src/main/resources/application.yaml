vaadin:
  pushmode: automatic
server:
  port: ${SERVER_PORT:8282}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: ${SPRING_AI_PLAYGROUND_ACTUATOR_INCLUDE:health,info,metrics,prometheus,beans}
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    # Longer expiry + percentile-histogram so dashboard MAX/p95 don't decay every step.
    distribution:
      percentiles-histogram:
        gen_ai.client.operation: true
        spring.ai.chat.client: true
        spring.ai.tool: true
        db.vector.client.operation: true
      maximum-expected-value:
        gen_ai.client.operation: 5m
        spring.ai.chat.client: 5m
        spring.ai.tool: 5m
        db.vector.client.operation: 2m
      expiry:
        gen_ai.client.operation: 30m
        spring.ai.chat.client: 30m
        spring.ai.tool: 30m
        db.vector.client.operation: 30m
  observations:
    annotations:
      enabled: true
  tracing:
    sampling:
      probability: ${SPRING_AI_PLAYGROUND_TRACE_SAMPLE:1.0}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  application:
    name: spring-ai-playground
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  profiles:
    default: ollama
  ai:
    model:
      chat: ollama
      embedding: ollama
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    chat:
      observations:
        log-prompt: ${SPRING_AI_OBSERVE_LOG_PROMPT:false}
        log-completion: ${SPRING_AI_OBSERVE_LOG_COMPLETION:false}
        include-error-logging: true
      client:
        observations:
          log-prompt: ${SPRING_AI_CLIENT_OBSERVE_LOG_PROMPT:false}
          log-completion: ${SPRING_AI_CLIENT_OBSERVE_LOG_COMPLETION:false}
    tools:
      observations:
        include-content: ${SPRING_AI_TOOLS_OBSERVE_INCLUDE_CONTENT:false}
    vectorstore:
      observations:
        log-query-response: ${SPRING_AI_VECTORSTORE_OBSERVE_LOG:false}
    playground:
      observability:
        ring-buffer-capacity: ${OBS_RING_CAPACITY:2000}
        retain-days: ${OBS_RETAIN_DAYS:30}
        persist: ${OBS_PERSIST:true}
        max-spans-per-trace: ${OBS_MAX_SPANS:200}
      tool-studio:
        timeout-seconds: 30
        spec-location: "classpath*:tool/default-tool-specs*.json"
        fs:
          base-path: ${TOOL_STUDIO_FS_BASE:${user.home}/spring-ai-playground/fs-tool-workspace}
        js-sandbox:
          allow-network-io: false
          allow-file-io: false
          allow-native-access: false
          allow-create-thread: false
          max-statements: 500000
          # Classes/packages user JS must never access. Evaluated before allow-classes — deny ALWAYS wins.
          # Removing entries lowers sandbox security; keep defaults unless you know what you are doing.
          deny-classes:
            - java.lang.System              # env vars, System.exit, etc.
            - java.lang.Runtime             # exec / halt
            - java.lang.ProcessBuilder      # spawn external processes
            - java.lang.Process             # ProcessBuilder result
            - java.lang.Class               # Class.forName bypass
            - java.lang.invoke.*            # MethodHandle and dynamic dispatch
            - java.lang.reflect.*           # Method.invoke and reflection
            - java.lang.Thread              # thread spawn (allow-create-thread:false also guards runtime)
            - java.lang.ThreadGroup         # thread group manipulation
            - java.lang.ClassLoader         # defineClass — sandbox escape vector
            - java.util.ServiceLoader       # SPI load — instantiates arbitrary classes from classpath
            - java.util.spi.*               # Service Provider Interface — same risk
          allow-classes:
            # Safe core packages — pure compute, no I/O capability
            - java.lang.*                  # String, StringBuilder, System.getProperty, etc.
            - java.math.*                  # BigDecimal, BigInteger, etc.
            - java.time.*                  # Instant, Duration, ZonedDateTime, etc.
            - java.util.*                  # List, Map, Set, UUID, Base64, Collections, etc.
            - java.text.*                  # DateFormat, NumberFormat, etc.
            # network / fs / parser classes removed — use built-in `fetch`, `safety.fs`, `safety.parser.*`
            # tools needing raw Java network/fs must opt in via per-tool `addAllowClasses` (raises L4–L5).

      user-home: ${user.home}
      chat:
        system-prompt:
        memory-max-messages: 10
        history-max-messages: 2000
        default-max-tokens: 8192
      built-in-mcp-server:
        name: ${SPRING_AI_PLAYGROUND_MCP_NAME:spring-ai-playground-built-in-mcp}
        description: "${SPRING_AI_PLAYGROUND_MCP_DESCRIPTION:Spring AI Playground's built-in MCP server, served over Streamable HTTP at /mcp. Publishes your native Tool Studio tools (default catalog + custom) plus composed tools from connected external MCP servers, per the configured exposure mode.}"
        exposure-mode: ${SPRING_AI_PLAYGROUND_MCP_EXPOSURE_MODE:both}
      mcp-server:
        composed-tools-max-risk: L5
        composed-tools: []
    mcp:
      client:
        type: SYNC
        initialized: false
      server:
        name: ${spring.ai.playground.built-in-mcp-server.name}
        protocol: STREAMABLE
        type: SYNC
        # Server-to-client elicitation (HITL) timeout; must outlast the client's 2-min decision wait (bare number = millis).
        request-timeout: 150s

---
spring:
  config:
    activate:
      on-profile: ollama
  ai:
    model:
      chat: ollama
    ollama:
      init:
        pull-model-strategy: when_missing
      chat:
        options:
          model: qwen3.5:2b
      embedding:
        options:
          model: qwen3-embedding:0.6b
    playground:
      chat:
        models:
          - qwen3.5:2b
          - qwen3.5:9b
          - qwen3.6:35b
          - gemma4:e4b
          - gpt-oss:20b
          - deepseek-r1:8b
---
# activated by AppleSiliconMlxActivator on Apple Silicon, not a manual profile
spring:
  config:
    activate:
      on-profile: mlx
  ai:
    ollama:
      chat:
        options:
          model: qwen3.5:4b-mlx
    playground:
      chat:
        models:
          - qwen3.5:2b-mlx
          - qwen3.5:4b-mlx
          - qwen3.5:9b-mlx
          - qwen3.6:27b-mlx
          - qwen3.6:35b-mlx
          - gemma4:e2b-mlx
          - gemma4:e4b-mlx
          - gemma4:12b-mlx
          - gemma4:31b-mlx
---
spring:
  config:
    activate:
      on-profile: openai
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5.4-mini
          stream-options:
            include-usage: true
      embedding:
        options:
          model: text-embedding-3-small
    playground:
      chat:
        models:
          - gpt-5.4
          - gpt-5.4-mini
          - gpt-5.4-nano
          - gpt-5.2
