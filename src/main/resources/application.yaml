vaadin:
  pushmode: automatic
server:
  port: ${SERVER_PORT:8282}
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  application:
    name: spring-ai-playground
    default-tool-location: classpath:default-tool-specs.json
  profiles:
    default: ollama
  ai:
    model:
      chat: ollama
      embedding: ollama
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    playground:
      tool-studio:
        timeout-seconds: 30
        js-sandbox:
          allow-network-io: true
          allow-file-io: false
          allow-native-access: false
          allow-create-thread: false
          max-statements: 500000
          allow-classes:
            # Completely safe core packages — strongly recommended to allow entirely
            - java.lang.*                  # String, StringBuilder, System.getProperty, etc. (basic utilities)
            - java.math.*                  # BigDecimal, BigInteger, etc. (mathematical calculations)
            - java.time.*                  # Instant, Duration, ZonedDateTime, etc. (date/time handling)
            - java.util.*                  # List, Map, Set, UUID, Base64, Collections, etc. (collections and utilities)
            - java.text.*                  # DateFormat, NumberFormat, etc. (formatting utilities)
            - java.net.*                   # URL, HttpURLConnection, URI, URLEncoder, etc.
            # I/O streams — used for handling network responses (safe because allowIO(false) blocks file access)
            - java.io.*
            # HttpClient
            - java.net.http.HttpClient
            - java.net.http.HttpRequest
            - java.net.http.HttpResponse
            - java.net.http.HttpHeaders
            # HTML parsing library — currently used in examples
            - org.jsoup.*

      user-home: ${user.home}
      chat:
        system-prompt:
    mcp:
      client:
        type: SYNC
        initialized: false
      server:
        name: spring-ai-playground-tool-mcp
        protocol: STREAMABLE
        type: SYNC
        request-timeout: 30

---
spring:
  config:
    activate:
      on-profile: ollama
  ai:
    model:
      chat: ollama
    ollama:
      init:
        pull-model-strategy: when_missing
      chat:
        options:
          model: qwen3.5:2b
      embedding:
        options:
          model: qwen3-embedding:0.6b
    playground:
      chat:
        models:
          - qwen3.5:2b
          - qwen3.5:9b
          - gemma4:e4b
          - gpt-oss:20b
          - deepseek-r1:8b
---
spring:
  config:
    activate:
      on-profile: openai
  ai:
    model:
      chat: openai-sdk
      embedding: openai-sdk
    openai-sdk:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5.4-mini
          stream-options:
            include-usage: false
      embedding:
        options:
          model: text-embedding-3-small
    playground:
      chat:
        models:
          - gpt-5.4
          - gpt-5.4-mini
          - gpt-5.4-nano
          - gpt-5.2
