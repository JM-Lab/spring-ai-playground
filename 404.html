<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spring AI Playground has moved</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  var oldBase = "/spring-ai-playground/";
  var newBase = "https://spring-ai-community.github.io/spring-ai-playground/";
  var path = window.location.pathname;
  var rest = path.indexOf(oldBase) === 0 ? path.substring(oldBase.length) : "";
  window.location.replace(newBase + rest + window.location.search + window.location.hash);
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 40rem; margin: 20vh auto; padding: 0 16px; text-align: center; }
  a { font-size: 1.2rem; }
</style>
</head>
<body>
<h1>Spring AI Playground has moved</h1>
<p>The documentation now lives at:</p>
<p><a href="https://spring-ai-community.github.io/spring-ai-playground/">https://spring-ai-community.github.io/spring-ai-playground/</a></p>
</body>
</html>
