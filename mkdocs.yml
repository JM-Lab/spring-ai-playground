site_name: Spring AI Playground
site_description: Cross-platform desktop app and safe local execution layer for AI agent tools with Tool Studio, MCP, Agentic Chat, RAG, and No pass, no run validation.
site_url: https://spring-ai-community.github.io/spring-ai-playground/
site_author: Spring AI Community
repo_url: https://github.com/spring-ai-community/spring-ai-playground
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025 Spring AI Community · <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache License 2.0</a> · <a href="/spring-ai-playground/#analytics">Analytics</a>

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/spring-ai-community/spring-ai-playground
      name: Spring AI Playground on GitHub

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      skip_classes:
        - tcg-favicon
  - social:
      cards_layout_options:
        background_color: "#3F51B5"
        color: "#FFFFFF"
hooks:
  - docs-overrides/hooks/count_guard.py
theme:
  name: material
  custom_dir: docs-overrides
  logo: assets/images/icon.png
  favicon: assets/images/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view

nav:
  - Home: index.md
  - "Getting Started":
      - getting-started/index.md
      - "Desktop App": getting-started/desktop.md
      - "Alternative Runtimes": getting-started/alternative-runtimes.md
      - "External Connections": getting-started/external-connections.md
      - "Configuration": getting-started/configuration.md
  - "Architecture":
      - "Application": architecture.md
      - "Safety":
          - "AI Agent Tool Safety": safety-architecture.md
          - "Safe Tool Specification": safe-tool-specification.md
          - "MCP Server Safety": mcp-server-safety.md
          - "Human-in-the-Loop Approval": hitl-architecture.md
          - "OWASP MCP Top 10": mcp-owasp-top-10.md
      - "Agent Runtime":
          - "Agent Loop": agent-loop-architecture.md
          - "Context Engineering": context-engineering-architecture.md
          - "AI Agent Observability": observability-architecture.md
  - "Features":
      - features/index.md
      - "Tool Studio":
          - features/tool-studio/index.md
          - "Default Tools":
              - features/default-tools/index.md
              - "Examples": features/default-tools/examples.md
              - "Utilities": features/default-tools/utilities.md
              - "Filesystem": features/default-tools/filesystem.md
              - "Global": features/default-tools/global.md
              - "Korea": features/default-tools/korea.md
              - "Visualization & cards": features/default-tools/visualization.md
      - "MCP Server":
          - features/mcp-server/index.md
          - "Default MCP Servers":
              - features/default-mcp-catalog/index.md
              - "Productivity & Communication": features/default-mcp-catalog/productivity.md
              - "Dev & Project Management": features/default-mcp-catalog/dev.md
              - "Data & Cloud": features/default-mcp-catalog/data-cloud.md
              - "Business": features/default-mcp-catalog/business.md
              - "Search": features/default-mcp-catalog/search.md
              - "Examples": features/default-mcp-catalog/examples.md
          - "MCP Inspector": features/mcp-server/inspector.md
          - "MCP Server Proxy": features/mcp-server/proxy.md
      - "Vector Database": features/vector-database.md
      - "Agentic Chat":
          - features/agentic-chat/index.md
          - "Self-equipping Agents": features/agentic-chat/dynamic-tool-discovery.md
          - "Prompt Templates": features/agentic-chat/prompt-templates.md
          - "Prompt Presets": features/agentic-chat/prompt-presets.md
          - "Multimodal Vision": features/agentic-chat/image-attachments.md
      - "Human-in-the-Loop": features/human-in-the-loop.md
      - "Observability":
          - features/observability/index.md
          - "Overview": features/observability/overview.md
          - "AI Usage":
              - features/observability/ai-usage/index.md
              - "Tokens & Cost": features/observability/ai-usage/tokens-cost.md
              - "AI Models": features/observability/ai-usage/ai-models.md
          - "AI Stack":
              - features/observability/ai-stack/index.md
              - "Tool Studio": features/observability/ai-stack/tool-studio.md
              - "MCP Servers": features/observability/ai-stack/mcp-servers.md
              - "MCP Inspector": features/observability/ai-stack/mcp-inspector.md
              - "Vector Database": features/observability/ai-stack/vector-database.md
              - "Agentic Chat": features/observability/ai-stack/agentic-chat.md
              - "Safety": features/observability/ai-stack/safety.md
          - "Runtime":
              - features/observability/runtime/index.md
              - "Host": features/observability/runtime/host.md
              - "Ollama": features/observability/runtime/ollama.md
              - "Web Application": features/observability/runtime/web-application.md
              - "Logs": features/observability/runtime/logs.md
              - "Traces": features/observability/runtime/traces.md
  - "Tutorials":
      - tutorials/index.md
      - "1. Author a Tool": tutorials/1-author-tool.md
      - "2. External MCP Server": tutorials/2-external-mcp.md
      - "3. Index a Document": tutorials/3-index-document.md
      - "4. Chat with Tools": tutorials/4-chat-tools.md
      - "5. Chat with RAG": tutorials/5-chat-rag.md
      - "6. Tools and RAG": tutorials/6-tools-and-rag.md
      - "7. Weather to Slack": tutorials/7-weather-to-slack.md
      - "8. Default Tool Recipes": tutorials/8-default-tool-recipes.md
      - "9. MCP Everything Walkthrough": tutorials/9-mcp-everything.md
      - "10. Proxy an MCP Server": tutorials/10-proxy-external-tool.md
      - "11. Approve a Tool in Chat": tutorials/11-human-approval.md
      - "12. Template to Preset": tutorials/12-template-to-preset.md
      - "13. Upload and Analyze a File": tutorials/13-upload-a-file.md
      - "14. Attach and Analyze an Image": tutorials/14-analyze-an-image.md
      - "15. Investigate Documents": tutorials/15-investigate-documents.md
  # Changelog is published in the repo as CHANGELOG.md (and rendered at
  # /changelog/ when reached by URL via the docs/changelog.md include).
  # Intentionally omitted from main nav to avoid duplicating GitHub-hosted
  # release notes in the site menu.

docs_dir: docs

# Files that live under docs/ but are developer-facing notes, not published pages.
exclude_docs: |
  /assets/images/README.md
  /requirements.txt

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js
  - assets/javascripts/mermaid-pan-zoom.js
  - assets/javascripts/card-stretched-link.js
  - assets/javascripts/default-tools-search.js
  - assets/javascripts/nav-default-expand.js
  - assets/javascripts/verify-version-resolve.js

markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - admonition
  # Numbered steps in tutorials are split into separate <ol> blocks by the
  # images between items; sane_lists keeps the authored start number (start=)
  # so step numbering renders 1, 2, 3 instead of resetting to 1.
  - sane_lists
  - tables
  - toc:
      # Right-rail TOC shows only h2 (## headings). h3+ stay in body
      # so per-page index stays short on every page including mobile.
      toc_depth: 2
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
