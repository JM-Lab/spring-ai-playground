<!DOCTYPE html>
<html>
<head>
    <script src="telemetry.js"></script>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          width: 400px; height: 300px;
          background: #1e1e2e;
          display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          color: white; font-family: sans-serif;
          border-radius: 12px;
        }
        .logo { font-size: 2rem; font-weight: bold; margin-bottom: 1rem; }
        .bar-wrap { width: 200px; height: 4px; background: #333; border-radius: 2px; }
        .bar {
          height: 100%; width: 0; background: #7c6af7; border-radius: 2px;
          animation: load 1.5s ease-in-out forwards;
        }
        @keyframes load { to { width: 100%; } }
    </style>
</head>
<body>
<div class="logo">🚀 MyApp</div>
<div class="bar-wrap"><div class="bar"></div></div>
<p style="margin-top: 1rem; opacity: 0.5; font-size: 0.8rem;">Starting...</p>
</body>
</html>
