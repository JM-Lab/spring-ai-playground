name: Sync README from upstream main

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:17 UTC (15:17 KST)
    - cron: '17 6 * * *'

permissions:
  contents: write

concurrency:
  group: sync-readme-from-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (carries workflow + overlay files)
        uses: actions/checkout@v4
        with:
          ref: docs/official-repo-banner
          fetch-depth: 0

      - name: Add upstream remote and fetch latest main
        run: |
          git remote add upstream https://github.com/spring-ai-community/spring-ai-playground.git
          git fetch upstream main

      - name: Bring upstream/main file contents into working tree
        run: |
          # Copies upstream/main's tracked files into the working tree.
          # Files that exist only in HEAD (not in upstream/main) are left in place.
          git checkout upstream/main -- .

      - name: Freeze .github/workflows and .github/personal-overlay at HEAD
        run: |
          # GITHUB_TOKEN cannot create or update workflow files, so we never
          # sync .github/workflows from upstream — keep HEAD's versions.
          # Same treatment for the personal-overlay dir to keep the banner stable.
          rm -rf .github/workflows .github/personal-overlay
          git checkout HEAD -- .github/workflows .github/personal-overlay

      - name: Prepend banner to README
        run: |
          cat .github/personal-overlay/banner.md README.md > /tmp/README.new
          mv /tmp/README.new README.md

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push (skip if no changes)
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git commit -s -m "chore: sync README from upstream main + apply personal overlay"
          git push origin HEAD:docs/official-repo-banner
